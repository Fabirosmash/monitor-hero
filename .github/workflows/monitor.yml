name: Monitor Hero Points

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (UTC; o GitHub pode atrasar em horário de pico)
  workflow_dispatch:         # permite rodar manualmente pela aba Actions

permissions:
  contents: write            # necessário para salvar o arquivo de estado no repositório

concurrency:
  group: monitor-hero
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_hero.py

      - name: Salvar estado (evita alertas repetidos)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor_hero_state.json
          if git diff --cached --quiet; then
            echo "Estado sem mudanças."
          else
            git commit -m "Atualiza estado do monitor"
            git pull --rebase
            git push
          fi
